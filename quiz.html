<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>建築師高考｜逐題模擬考</title>
<style>
:root{--ink:#152a35;--muted:#6b7b7c;--paper:#f7f4ed;--card:#fffdf8;--teal:#0d6f6b;--mint:#d9efeb;--gold:#e9b949;--red:#bc5b4d;--line:#dce5df;--shadow:0 18px 45px #173f3c12}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans TC",sans-serif}.shell{max-width:1180px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;gap:12px;align-items:center}.mark{width:45px;height:45px;border-radius:13px;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:900;line-height:1.0}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--teal);font-weight:900}.title{margin:4px 0 0;font-size:clamp(24px,4vw,38px);letter-spacing:-.06em}.top a{color:var(--teal);font-weight:800;text-decoration:none;font-size:13px}.setup,.quiz,.result,.essay{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.setup{padding:20px;margin-bottom:18px}.setup-grid{display:grid;grid-template-columns:1fr 1fr 1.3fr 1fr auto;gap:12px;align-items:end}.field label{display:block;color:var(--muted);font-size:12px;font-weight:800;margin-bottom:7px}.select,.input{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;color:var(--ink);font:inherit}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:11px 15px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn:hover{border-color:#75b5ad}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.gold{background:var(--gold);border-color:var(--gold)}.helper{margin-top:13px;color:var(--muted);font-size:12px}.quiz{padding:24px}.quiz-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:17px}.kicker{font-size:12px;color:var(--teal);font-weight:900;letter-spacing:.08em}.quiz h2{margin:5px 0;font-size:24px;letter-spacing:-.04em}.meta{color:var(--muted);font-size:13px}.timer{font-size:24px;font-weight:900;color:var(--teal);background:var(--mint);border-radius:11px;padding:8px 12px;font-variant-numeric:tabular-nums;white-space:nowrap}.bar{height:8px;background:#e8eeeb;border-radius:99px;overflow:hidden;margin:17px 0}.bar i{display:block;height:100%;background:var(--teal);width:0;transition:.25s}.qtop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.qnum{color:var(--muted);font-size:13px;font-weight:900}.flag{border:0;background:transparent;color:var(--teal);font-weight:900;cursor:pointer}.flag.on{color:var(--red)}.question{font-size:20px;line-height:1.75;margin:0 0 22px;white-space:pre-wrap}.options{display:grid;gap:11px}.option{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:13px;padding:14px;cursor:pointer;line-height:1.65}.option:hover{border-color:#80bbb3;background:#f5fbf9}.option.selected{background:var(--mint);border-color:#78b8af}.option input{accent-color:var(--teal);margin-top:5px}.letter{font-weight:900;color:var(--teal);min-width:20px}.quiz-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}.foot-actions{display:flex;gap:9px;flex-wrap:wrap}.small{font-size:12px;color:var(--muted)}.result{padding:24px}.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.score{padding:16px;border:1px solid var(--line);border-radius:14px}.score span{display:block;color:var(--muted);font-size:12px}.score strong{font-size:27px;display:block;margin-top:4px}.review{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px;margin-top:17px}.review button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px;text-align:left;cursor:pointer}.review button.good{border-color:#87c5ae;background:#effaf4}.review button.bad{border-color:#e7a49b;background:#fff3f1}.review button span{display:block;font-size:12px;color:var(--muted);margin-top:4px}.result h2{margin:0}.essay{padding:28px;text-align:center}.essay h2{margin-top:0}.essay p{color:var(--muted);line-height:1.7}.pdf{width:100%;height:600px;border:0;border-radius:13px;background:#eef2ef;margin-top:16px}.hidden{display:none!important}.footnote{text-align:center;color:var(--muted);font-size:12px;margin:20px 0}.footnote a{color:var(--teal)}
@media(max-width:850px){.setup-grid{grid-template-columns:1fr 1fr}.setup-grid .start{grid-column:span 2}.quiz-head{display:block}.timer{display:inline-block;margin-top:12px}.result-grid{grid-template-columns:1fr 1fr}}@media(max-width:540px){.shell{padding:15px}.setup-grid{grid-template-columns:1fr}.setup-grid .start{grid-column:auto}.quiz,.setup,.result{padding:17px}.question{font-size:18px}.quiz-foot{display:block}.foot-actions{margin-top:14px}.result-grid{grid-template-columns:1fr 1fr}}
</style></head>
<body><main class="shell">
<header class="top"><div class="brand"><div class="mark">建築<br>師</div><div><div class="eyebrow">ARCHITECT EXAM LAB</div><h1 class="title">逐題模擬考</h1></div></div><a href="index.html">← 回到題目總覽</a></header>
<section class="setup"><div class="setup-grid"><div class="field"><label for="year">年度</label><select class="select" id="year"></select></div><div class="field"><label for="subject">科目</label><select class="select" id="subject"></select></div><div class="field"><label for="mode">練習範圍</label><select class="select" id="mode"><option value="all">全部題目</option><option value="random">隨機抽題</option><option value="wrong">錯題重做</option></select></div><div class="field"><label for="count">題數</label><select class="select" id="count"><option value="10">10 題</option><option value="20">20 題</option><option value="50">50 題</option><option value="all">全部</option></select></div><button class="btn primary start" id="start">開始模擬考 →</button></div><div class="helper" id="helper">從題庫選題後，按「開始模擬考」進入逐題作答。</div></section>
<section class="quiz" id="quiz"><div class="quiz-head"><div><div class="kicker" id="kicker">ARCHITECTURE EXAM</div><h2 id="quizTitle">準備開始</h2><div class="meta" id="quizMeta">請先選擇年度與科目</div></div><div class="timer" id="timer">00:00:00</div></div><div class="bar"><i id="bar"></i></div><div id="questionArea"><div class="essay"><h2>準備開始一回練習</h2><p>選擇年度、科目與題數後，這裡會一題一題呈現題目。</p></div></div></section>
<section class="result hidden" id="result"></section><section class="essay hidden" id="essay"></section>
<p class="footnote">題目與答案整理自 <a href="https://wwwq.moex.gov.tw/exam/wFrmExamQandASearch.aspx?e=114180&y=2025" target="_blank" rel="noopener">考選部考畢試題查詢平台</a> · 成績僅儲存在本機瀏覽器</p>
</main>
<script>
const years=[2025,2024,2023,2022,2021],roc={2025:114,2024:113,2023:112,2022:111,2021:110};
const subjects=[['0101','營建法規與實務'],['0102','建築結構'],['0103','建築構造與施工'],['0104','建築環境控制'],['0105','敷地計畫與都市設計'],['0106','建築計畫與設計']];
const $=id=>document.getElementById(id); let bank=[],exam=[],answers={},marked={},current=0,seconds=0,timer=null,submitted=false;
years.forEach(y=>{let o=document.createElement('option');o.value=y;o.textContent=`${roc[y]} 年（${y}）`;$('year').append(o)});subjects.forEach(s=>{let o=document.createElement('option');o.value=s[0];o.textContent=s[1];$('subject').append(o)});
fetch('data/questions.json').then(r=>r.json()).then(d=>{bank=d.questions; updateHelper()}).catch(()=>{$('helper').textContent='題庫載入失敗，請以本機伺服器開啟網站。'});
function updateHelper(){const y=+$('year').value,c=$('subject').value,n=bank.filter(q=>q.year===y&&q.subjectCode===c).length;$('helper').textContent=n?`${y} 年「${subjects.find(s=>s[0]===c)[1]}」目前可逐題練習 ${n} 題。`:'此科目目前採 PDF 題目閱讀與自我評分模式。'}
$('year').onchange=updateHelper;$('subject').onchange=updateHelper;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function startExam(){const y=+$('year').value,c=$('subject').value,mode=$('mode').value,count=$('count').value;let pool=bank.filter(q=>q.year===y&&q.subjectCode===c);if(mode==='wrong'){const wrong=JSON.parse(localStorage.getItem('architectWrong')||'[]');pool=pool.filter(q=>wrong.includes(`${q.year}-${q.subjectCode}-${q.number}`))}if(mode==='random')pool=shuffle(pool);if(count!=='all')pool=pool.slice(0,+count);if(!pool.length){showEssay(y,c);return}exam=pool;answers={};marked={};current=0;seconds=0;submitted=false;startTimer();$('result').classList.add('hidden');$('essay').classList.add('hidden');$('quiz').classList.remove('hidden');renderQuestion()}
function startTimer(){if(timer)clearInterval(timer);timer=setInterval(()=>{seconds++;$('timer').textContent=fmt(seconds)},1000)}function fmt(n){return [Math.floor(n/3600),Math.floor(n/60)%60,n%60].map(x=>String(x).padStart(2,'0')).join(':')}
function renderQuestion(){const q=exam[current],s=subjects.find(x=>x[0]===q.subjectCode);$('kicker').textContent=`${q.year}｜${s[1]}`;$('quizTitle').textContent=`第 ${current+1} 題`;$('quizMeta').textContent=`共 ${exam.length} 題 · ${q.answer?'可自動判分':'請自我評分'}`;$('bar').style.width=`${((current+1)/exam.length)*100}%`;$('questionArea').innerHTML=`<div class="qtop"><span class="qnum">題庫題號 ${q.number}</span><button class="flag ${marked[current]?'on':''}" id="flag">⚑ ${marked[current]?'已標記':'標記本題'}</button></div><p class="question">${esc(q.question)}</p><div class="options">${Object.entries(q.options).map(([k,v])=>`<label class="option ${answers[current]===k?'selected':''}"><input type="radio" name="answer" value="${k}" ${answers[current]===k?'checked':''}><span class="letter">${k}</span><span>${esc(v)}</span></label>`).join('')}</div><div class="quiz-foot"><span class="small">${marked[current]?'已加入稍後檢討':'可標記需要回看的題目'}</span><div class="foot-actions"><button class="btn" id="prev" ${current===0?'disabled':''}>← 上一題</button><button class="btn" id="next">${current===exam.length-1?'交卷':'下一題 →'}</button></div></div>`;document.querySelectorAll('input[name=answer]').forEach(i=>i.onchange=e=>{answers[current]=e.target.value;renderQuestion()});$('flag').onclick=()=>{marked[current]=!marked[current];renderQuestion()};$('prev').onclick=()=>{current--;renderQuestion()};$('next').onclick=()=>current===exam.length-1?submitExam(): (current++,renderQuestion())}
function submitExam(){if(timer)clearInterval(timer);timer=null;submitted=true;let correct=0,answered=0;exam.forEach((q,i)=>{if(answers[i])answered++;if(q.answer&&answers[i]===q.answer)correct++});const wrong=exam.filter((q,i)=>q.answer&&answers[i]!==q.answer).map(q=>`${q.year}-${q.subjectCode}-${q.number}`);localStorage.setItem('architectWrong',JSON.stringify([...new Set([...(JSON.parse(localStorage.getItem('architectWrong')||'[]')), ...wrong])]));$('result').classList.remove('hidden');$('result').innerHTML=`<h2>本回練習完成</h2><div class="meta">${exam[0].year}｜${subjects.find(s=>s[0]===exam[0].subjectCode)[1]} · 用時 ${fmt(seconds)}</div><div class="result-grid"><div class="score"><span>得分</span><strong>${exam.some(q=>q.answer)?`${correct} / ${exam.length}`:'自評'}</strong></div><div class="score"><span>正確率</span><strong>${exam.some(q=>q.answer)?`${Math.round(correct/exam.length*100)}%`:'—'}</strong></div><div class="score"><span>已作答</span><strong>${answered} 題</strong></div><div class="score"><span>標記題</span><strong>${Object.values(marked).filter(Boolean).length} 題</strong></div></div><div class="foot-actions"><button class="btn primary" id="again">再做一次</button><a class="btn" href="assets/${exam[0].year}-${exam[0].subjectCode}-q.pdf" target="_blank">開啟原始試題 ↗</a>${exam.some(q=>q.answer)?'<button class="btn gold" id="wrongOnly">只看錯題</button>':''}</div><div class="review">${exam.map((q,i)=>`<button class="${q.answer?(answers[i]===q.answer?'good':'bad'):''}" data-i="${i}">第 ${i+1} 題｜${answers[i]||'未作答'}<span>${q.answer?('正解 '+q.answer):'請對照題目自評'}</span></button>`).join('')}</div>`;document.querySelectorAll('.review button').forEach(b=>b.onclick=()=>{current=+b.dataset.i;$('result').classList.add('hidden');renderQuestion()});$('again').onclick=startExam;const w=$('wrongOnly');if(w)w.onclick=()=>{exam=exam.filter((q,i)=>q.answer&&answers[i]!==q.answer);answers={};current=0;submitted=false;$('result').classList.add('hidden');startTimer();renderQuestion()}}
function showEssay(y,c){const s=subjects.find(x=>x[0]===c);$('essay').classList.remove('hidden');$('essay').innerHTML=`<h2>${roc[y]} 年｜${s[1]}</h2><p>此科目目前尚未轉成可自動判分的選擇題題庫，先提供逐題閱讀與自我評分入口。</p><a class="btn gold" href="assets/${y}-${c}-q.pdf" target="_blank">開啟官方試題 ↗</a><iframe class="pdf" src="assets/${y}-${c}-q.pdf#view=FitH"></iframe>`;$('result').classList.add('hidden')}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('start').onclick=startExam;updateHelper();
</script></body></html>
